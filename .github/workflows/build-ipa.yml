name: Build IPA

# 两种触发方式：在 Actions 页面手动点 Run workflow，或者推送代码到 main 分支自动构建
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 构建 App（关闭签名）
        run: |
          xcodebuild build \
            -project PixelArcade/PixelArcade.xcodeproj \
            -scheme PixelArcade \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: 打成未签名 IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PixelArcade.app Payload/
          zip -qry PixelArcade-unsigned.ipa Payload

      - name: 上传 IPA 成品
        uses: actions/upload-artifact@v4
        with:
          name: PixelArcade-unsigned
          path: PixelArcade-unsigned.ipa
